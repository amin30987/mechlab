<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mechanical Lab Inventory</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#071827">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MechLab">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #ebf0f5; color: #0a192d; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Top Navigation Bar */
        header { background-color: #071827; color: white; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; height: 54px; flex-shrink: 0; }
        header h1 { font-size: 18px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-back { background-color: #145b9d; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; }

        /* Main Scrollable Content Area */
        main { flex: 1; overflow-y: auto; padding: 12px; }
        
        /* Cards & Layout */
        .card { background-color: white; border-radius: 6px; border: 1px solid #b4c3d2; padding: 12px; margin-bottom: 12px; }
        .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .col { flex: 1; }
        
        /* Typography */
        h2 { font-size: 15px; font-weight: bold; color: #071827; margin-bottom: 6px; }
        p { font-size: 13px; color: #465564; }
        .text-center { text-align: center; }

        /* Form Controls */
        label { font-size: 13px; font-weight: bold; color: #071827; display: block; margin: 8px 0 4px 0; }
        input[type="text"], input[type="date"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; background-color: white; }
        textarea { resize: vertical; min-height: 60px; }
        
        /* Buttons */
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; color: white; font-size: 13px; font-weight: bold; cursor: pointer; text-align: center; margin-top: 8px; }
        .btn-green { background-color: #249d6b; }
        .btn-blue { background-color: #145b9d; }
        .btn-orange { background-color: #ef8b24; }
        .btn-red { background-color: #cc4c45; }
        .btn-purple { background-color: #800080; }
        .btn-navy { background-color: #071827; }
        .btn-inline { width: auto; padding: 8px 12px; margin-top: 0; }

        /* Bottom Tab Bar */
        nav { background-color: #071827; display: flex; height: 56px; flex-shrink: 0; }
        .tab-btn { flex: 1; background: none; border: none; color: white; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .tab-btn.active { background-color: #145b9d; }

        /* Item List Card */
        .item-card { display: flex; align-items: center; background: white; border: 1.5px solid #b4c3d2; border-radius: 6px; padding: 10px; margin-bottom: 8px; gap: 8px; cursor: pointer; }
        .item-card input[type="checkbox"] { width: 18px; height: 18px; }
        .item-info { flex: 1; }
        .item-thumb { width: 46px; height: 46px; object-fit: cover; border-radius: 4px; }
        
        /* Image Preview Area */
        .img-preview { width: 100%; max-height: 160px; object-fit: contain; margin-top: 8px; border-radius: 4px; background: #eee; display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1 id="header-title">Mechanical Lab</h1>
        <button id="back-btn" class="btn-back hidden" onclick="goBack()">← BACK</button>
    </header>

    <!-- Main Content Area -->
    <main id="app-content"></main>

    <!-- Bottom Navigation Bar -->
    <nav>
        <button class="tab-btn active" onclick="switchScreen('HOME')">📋 List</button>
        <button class="tab-btn" onclick="switchScreen('MORE')">⋮ More</button>
    </nav>

    <!-- Hidden Inputs for CSV/Image Handling -->
    <input type="file" id="file-input-csv" accept=".csv" class="hidden" onchange="handleCSVFileSelected(event)">
    <input type="file" id="file-input-img" accept="image/*" class="hidden" onchange="handleImageFileSelected(event)">
    <input type="file" id="camera-input-img" accept="image/*" capture="environment" class="hidden" onchange="handleImageFileSelected(event)">

    <script>
        // --- APP STATE & STORAGE ---
        let state = {
            currentScreen: 'HOME',
            currentLab: '',
            searchQuery: '',
            selectedIds: new Set(),
            editingId: null,
            tempImgUri: null,
            isOverwriteMode: false,
            screenStack: ['HOME']
        };

        let labProfiles = JSON.parse(localStorage.getItem('labProfiles')) || {
            'Lab 1 (Mechanical)': { equipmentList: [], teachingList: [], faultyList: [], writeOffList: [] },
            'Lab 2 (Automotive)': { equipmentList: [], teachingList: [], faultyList: [], writeOffList: [] }
        };

        let activityLogs = JSON.parse(localStorage.getItem('activityLogs')) || [];
        state.currentLab = localStorage.getItem('currentLab') || Object.keys(labProfiles)[0] || 'Lab 1 (Mechanical)';

        function saveData() {
            localStorage.setItem('labProfiles', JSON.stringify(labProfiles));
            localStorage.setItem('activityLogs', JSON.stringify(activityLogs));
            localStorage.setItem('currentLab', state.currentLab);
        }

        function addLog(action) {
            let timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
            activityLogs.unshift(`[${timestamp}] ${action}`);
            saveData();
        }

        // --- NAVIGATION CONTROLLER ---
        function switchScreen(screen, editingId = null) {
            state.currentScreen = screen;
            state.editingId = editingId;
            state.selectedIds.clear();
            state.searchQuery = '';
            
            if (state.screenStack[state.screenStack.length - 1] !== screen) {
                state.screenStack.push(screen);
            }
            render();
        }

        function goBack() {
            if (state.screenStack.length > 1) {
                state.screenStack.pop();
                state.currentScreen = state.screenStack[state.screenStack.length - 1];
                state.selectedIds.clear();
                state.searchQuery = '';
                render();
            }
        }

        // --- RENDER ENGINE ---
        function render() {
            let content = document.getElementById('app-content');
            let backBtn = document.getElementById('back-btn');
            let headerTitle = document.getElementById('header-title');

            // Header Title Setup
            headerTitle.innerText = state.currentLab ? `${getScreenTitle(state.currentScreen)} · ${state.currentLab}` : getScreenTitle(state.currentScreen);
            
            if (state.screenStack.length > 1) {
                backBtn.classList.remove('hidden');
            } else {
                backBtn.classList.add('hidden');
            }

            content.innerHTML = '';

            switch (state.currentScreen) {
                case 'HOME': renderHome(content); break;
                case 'EQUIPMENT_LIST': renderEquipmentList(content); break;
                case 'EQUIPMENT_EDIT': renderEquipmentEdit(content); break;
                case 'TEACHING_LIST': renderTeachingList(content); break;
                case 'TEACHING_EDIT': renderTeachingEdit(content); break;
                case 'FAULTY_LIST': renderFaultyList(content); break;
                case 'FAULTY_EDIT': renderFaultyEdit(content); break;
                case 'WRITEOFF_LIST': renderWriteOffList(content); break;
                case 'WRITEOFF_EDIT': renderWriteOffEdit(content); break;
                case 'MORE': renderMore(content); break;
                case 'LOGS': renderLogs(content); break;
            }
        }

        function getScreenTitle(screen) {
            switch(screen) {
                case 'HOME': return 'Mechanical Lab';
                case 'EQUIPMENT_LIST': return 'Equipment List';
                case 'EQUIPMENT_EDIT': return state.editingId ? 'Edit Equipment' : 'Add Equipment';
                case 'TEACHING_LIST': return 'Teaching Materials';
                case 'TEACHING_EDIT': return state.editingId ? 'Edit Teaching Material' : 'Add Teaching Material';
                case 'FAULTY_LIST': return 'Faulty / Repair';
                case 'FAULTY_EDIT': return state.editingId ? 'Edit Faulty Report' : 'Add Faulty Report';
                case 'WRITEOFF_LIST': return 'Asset Write Off';
                case 'WRITEOFF_EDIT': return state.editingId ? 'Edit Write Off' : 'Add Write Off';
                case 'MORE': return 'More Options';
                case 'LOGS': return 'Activity Logs';
                default: return 'Mechanical Lab';
            }
        }

        // --- SCREEN RENDERING IMPLEMENTATIONS ---

        // 1. HOME SCREEN
        function renderHome(container) {
            let html = `
                <div class="text-center" style="margin-bottom: 12px;">
                    <h2 style="font-size: 20px;">WELCOME</h2>
                    <p id="clock-display">${new Date().toLocaleString()}</p>
                </div>

                <div class="card">
                    <label>📍 Active Lab Location:</label>
                    <div class="row">
                        <select id="lab-select" onchange="onLabSwitched(this.value)" class="col">
                            ${Object.keys(labProfiles).map(lab => `<option value="${lab}" ${lab === state.currentLab ? 'selected' : ''}>${lab}</option>`).join('')}
                        </select>
                        <button class="btn btn-green btn-inline" onclick="addLabPrompt()">＋ Add</button>
                        <button class="btn btn-red btn-inline" onclick="deleteLabPrompt()">🗑</button>
                    </div>
                </div>

                <div>
                    <button class="btn btn-green" onclick="switchScreen('EQUIPMENT_LIST')">⚙ Equipment List<br><span style="font-size:11px;font-weight:normal;">Lab equipment & apparatus</span></button>
                    <button class="btn btn-purple" onclick="switchScreen('TEACHING_LIST')">📚 Teaching Materials<br><span style="font-size:11px;font-weight:normal;">Teaching materials to order</span></button>
                    <button class="btn btn-orange" onclick="switchScreen('FAULTY_LIST')">🔧 Faulty / Repair<br><span style="font-size:11px;font-weight:normal;">Report & track issues</span></button>
                    <button class="btn btn-red" onclick="switchScreen('WRITEOFF_LIST')">🗑 Asset to Write Off<br><span style="font-size:11px;font-weight:normal;">List & disposal status</span></button>
                </div>
            `;
            container.innerHTML = html;
        }

        function onLabSwitched(newLab) {
            state.currentLab = newLab;
            saveData();
            addLog(`Switched active lab location to: ${newLab}`);
            render();
        }

        function addLabPrompt() {
            let name = prompt("Enter New Lab Location Name:");
            if (name && name.trim()) {
                name = name.trim();
                if (!labProfiles[name]) {
                    labProfiles[name] = { equipmentList: [], teachingList: [], faultyList: [], writeOffList: [] };
                    state.currentLab = name;
                    saveData();
                    addLog(`Created new Lab Location: ${name}`);
                    render();
                } else {
                    alert("Lab location already exists!");
                }
            }
        }

        function deleteLabPrompt() {
            if (confirm(`Are you sure you want to delete lab location '${state.currentLab}'?\nAll records inside will be permanently removed!`)) {
                delete labProfiles[state.currentLab];
                addLog(`Deleted lab profile: ${state.currentLab}`);
                state.currentLab = Object.keys(labProfiles)[0] || '';
                saveData();
                render();
            }
        }

        // SEARCH BAR HELPER
        function renderSearchBar(container, placeholder, onSearch) {
            let searchDiv = document.createElement('div');
            searchDiv.innerHTML = `<input type="text" placeholder="🔍 ${placeholder}" value="${state.searchQuery}" oninput="onSearchInput(this.value)">`;
            container.appendChild(searchDiv);
        }

        function onSearchInput(val) {
            state.searchQuery = val;
            render();
        }

        function matchesQuery(text, query) {
            if (!query.trim()) return true;
            if (!text) return false;
            return text.toLowerCase().includes(query.toLowerCase());
        }

        // SELECTION BAR HELPER
        function renderSelectionBar(container, totalCount, onDeleteSelected) {
            let isAllSelected = totalCount > 0 && state.selectedIds.size === totalCount;
            let bar = document.createElement('div');
            bar.className = 'row card';
            bar.style.padding = '8px';
            bar.innerHTML = `
                <label class="col" style="margin:0;"><input type="checkbox" ${isAllSelected ? 'checked' : ''} onchange="toggleSelectAll(this.checked, ${totalCount})"> Select All (${state.selectedIds.size}/${totalCount})</label>
                <button class="btn btn-red btn-inline" onclick="confirmDeleteSelected()">🗑 Delete (${state.selectedIds.size})</button>
            `;
            container.appendChild(bar);
        }

        function toggleSelectAll(checked, totalCount) {
            let activeLab = labProfiles[state.currentLab];
            state.selectedIds.clear();
            if (checked && activeLab) {
                let items = getFilteredCurrentItems();
                items.forEach(item => state.selectedIds.add(item.id || item.code));
            }
            render();
        }

        function confirmDeleteSelected() {
            if (state.selectedIds.size === 0) {
                alert("Please select at least one item!");
                return;
            }
            if (confirm(`Delete ${state.selectedIds.size} item(s) from ${state.currentLab}?`)) {
                let activeLab = labProfiles[state.currentLab];
                if (state.currentScreen === 'EQUIPMENT_LIST') activeLab.equipmentList = activeLab.equipmentList.filter(i => !state.selectedIds.has(i.code));
                if (state.currentScreen === 'TEACHING_LIST') activeLab.teachingList = activeLab.teachingList.filter(i => !state.selectedIds.has(i.id));
                if (state.currentScreen === 'FAULTY_LIST') activeLab.faultyList = activeLab.faultyList.filter(i => !state.selectedIds.has(i.id));
                if (state.currentScreen === 'WRITEOFF_LIST') activeLab.writeOffList = activeLab.writeOffList.filter(i => !state.selectedIds.has(i.code));

                addLog(`Deleted ${state.selectedIds.size} item(s) from ${state.currentLab}`);
                state.selectedIds.clear();
                saveData();
                render();
            }
        }

        function getFilteredCurrentItems() {
            let activeLab = labProfiles[state.currentLab];
            if (!activeLab) return [];
            let q = state.searchQuery;

            if (state.currentScreen === 'EQUIPMENT_LIST') return activeLab.equipmentList.filter(i => matchesQuery(i.name, q) || matchesQuery(i.code, q));
            if (state.currentScreen === 'TEACHING_LIST') return activeLab.teachingList.filter(i => matchesQuery(i.name, q));
            if (state.currentScreen === 'FAULTY_LIST') return activeLab.faultyList.filter(i => matchesQuery(i.name, q) || matchesQuery(i.stockCode, q));
            if (state.currentScreen === 'WRITEOFF_LIST') return activeLab.writeOffList.filter(i => matchesQuery(i.name, q) || matchesQuery(i.code, q));
            return [];
        }

        // 2. EQUIPMENT LIST & EDIT
        function renderEquipmentList(container) {
            renderSearchBar(container, "Search Equipment Name...", val => {});
            let items = getFilteredCurrentItems();
            renderSelectionBar(container, items.length);

            let listDiv = document.createElement('div');
            items.forEach(item => {
                let card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <input type="checkbox" ${state.selectedIds.has(item.code) ? 'checked' : ''} onclick="event.stopPropagation(); toggleItemSelection('${item.code}')">
                    <div class="item-info">
                        <h2>${item.code} · ${item.name}</h2>
                    </div>
                    ${item.imageUri ? `<img src="${item.imageUri}" class="item-thumb">` : ''}
                `;
                card.onclick = () => switchScreen('EQUIPMENT_EDIT', item.code);
                listDiv.appendChild(card);
            });
            container.appendChild(listDiv);

            let addBtn = document.createElement('button');
            addBtn.className = 'btn btn-green';
            addBtn.innerText = '＋ Add Equipment';
            addBtn.onclick = () => { state.tempImgUri = null; switchScreen('EQUIPMENT_EDIT', null); };
            container.appendChild(addBtn);
        }

        function renderEquipmentEdit(container) {
            let activeLab = labProfiles[state.currentLab];
            let item = activeLab ? activeLab.equipmentList.find(i => i.code === state.editingId) : null;
            state.tempImgUri = state.tempImgUri !== null ? state.tempImgUri : (item ? item.imageUri : null);

            container.innerHTML = `
                ${renderImageEditorHTML()}
                <label>📦 Stock List Number / Equipment Code:</label>
                <input type="text" id="eq-code" placeholder="e.g. ST/P103/2015/E001" value="${item ? item.code : ''}">
                
                <label>⚙ Equipment Name:</label>
                <input type="text" id="eq-name" placeholder="e.g. Governors Apparatus" value="${item ? item.name : ''}">

                <button class="btn btn-green" onclick="saveEquipment()">💾 Save Equipment</button>
                ${item ? `<button class="btn btn-red" onclick="deleteSingleItem('equipmentList', '${item.code}')">❌ Delete Equipment</button>` : ''}
            `;
            updateImagePreview();
        }

        function saveEquipment() {
            let code = document.getElementById('eq-code').value.trim();
            let name = document.getElementById('eq-name').value.trim();
            if (!code || !name) { alert("Enter Stock Code and Equipment Name!"); return; }

            let activeLab = labProfiles[state.currentLab];
            if (state.editingId) {
                let item = activeLab.equipmentList.find(i => i.code === state.editingId);
                if (item) { item.code = code; item.name = name; item.imageUri = state.tempImgUri; }
                addLog(`Updated Equipment: ${code} in ${state.currentLab}`);
            } else {
                activeLab.equipmentList.push({ code, name, imageUri: state.tempImgUri });
                addLog(`Added Equipment: ${code} (${name}) in ${state.currentLab}`);
            }
            saveData();
            goBack();
        }

        // 3. TEACHING MATERIALS LIST & EDIT
        function renderTeachingList(container) {
            renderSearchBar(container, "Search Teaching Material Name...", val => {});
            let items = getFilteredCurrentItems();
            renderSelectionBar(container, items.length);

            let listDiv = document.createElement('div');
            items.forEach(item => {
                let card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <input type="checkbox" ${state.selectedIds.has(item.id) ? 'checked' : ''} onclick="event.stopPropagation(); toggleItemSelection('${item.id}')">
                    <div class="item-info">
                        <h2>${item.name}</h2>
                        <p>Quantity / Unit: ${item.qtyUnit}</p>
                    </div>
                `;
                card.onclick = () => switchScreen('TEACHING_EDIT', item.id);
                listDiv.appendChild(card);
            });
            container.appendChild(listDiv);

            let addBtn = document.createElement('button');
            addBtn.className = 'btn btn-purple';
            addBtn.innerText = '＋ Add Teaching Material Order';
            addBtn.onclick = () => { state.tempImgUri = null; switchScreen('TEACHING_EDIT', null); };
            container.appendChild(addBtn);
        }

        function renderTeachingEdit(container) {
            let activeLab = labProfiles[state.currentLab];
            let item = activeLab ? activeLab.teachingList.find(i => i.id === state.editingId) : null;
            state.tempImgUri = state.tempImgUri !== null ? state.tempImgUri : (item ? item.imageUri : null);

            container.innerHTML = `
                ${renderImageEditorHTML()}
                <label>📚 Teaching Material Item Name:</label>
                <input type="text" id="tm-name" placeholder="e.g. Marker Pen / Dust Bin" value="${item ? item.name : ''}">
                
                <label>🔢 Quantity / Unit:</label>
                <input type="text" id="tm-qty" placeholder="e.g. 5 boxes / 2 units" value="${item ? item.qtyUnit : ''}">

                <label>📝 Additional Remarks:</label>
                <textarea id="tm-remarks" placeholder="Enter additional remarks">${item ? (item.remarks || '') : ''}</textarea>

                <button class="btn btn-green" onclick="saveTeaching()">💾 Save Order Item</button>
                ${item ? `<button class="btn btn-red" onclick="deleteSingleItem('teachingList', '${item.id}')">❌ Delete Item</button>` : ''}
            `;
            updateImagePreview();
        }

        function saveTeaching() {
            let name = document.getElementById('tm-name').value.trim();
            let qty = document.getElementById('tm-qty').value.trim();
            let remarks = document.getElementById('tm-remarks').value.trim();
            if (!name || !qty) { alert("Enter Item Name and Quantity!"); return; }

            let activeLab = labProfiles[state.currentLab];
            if (state.editingId) {
                let item = activeLab.teachingList.find(i => i.id === state.editingId);
                if (item) { item.name = name; item.qtyUnit = qty; item.remarks = remarks; item.imageUri = state.tempImgUri; }
                addLog(`Updated Teaching Order: ${name} in ${state.currentLab}`);
            } else {
                let id = 'TM-' + Date.now();
                activeLab.teachingList.push({ id, name, qtyUnit: qty, remarks, imageUri: state.tempImgUri });
                addLog(`Added Teaching Order: ${name} (${qty}) in ${state.currentLab}`);
            }
            saveData();
            goBack();
        }

        // 4. FAULTY REPORT LIST & EDIT
        function renderFaultyList(container) {
            renderSearchBar(container, "Search Faulty Asset Name...", val => {});
            let items = getFilteredCurrentItems();
            renderSelectionBar(container, items.length);

            let listDiv = document.createElement('div');
            items.forEach(item => {
                let card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <input type="checkbox" ${state.selectedIds.has(item.id) ? 'checked' : ''} onclick="event.stopPropagation(); toggleItemSelection('${item.id}')">
                    <div class="item-info">
                        <h2>${item.name}</h2>
                        <p>${item.problem} • ${item.date} • <b>${item.status}</b></p>
                    </div>
                `;
                card.onclick = () => switchScreen('FAULTY_EDIT', item.id);
                listDiv.appendChild(card);
            });
            container.appendChild(listDiv);

            let addBtn = document.createElement('button');
            addBtn.className = 'btn btn-orange';
            addBtn.innerText = '＋ Add Faulty Report';
            addBtn.onclick = () => { state.tempImgUri = null; switchScreen('FAULTY_EDIT', null); };
            container.appendChild(addBtn);
        }

        function renderFaultyEdit(container) {
            let activeLab = labProfiles[state.currentLab];
            let item = activeLab ? activeLab.faultyList.find(i => i.id === state.editingId) : null;
            state.tempImgUri = state.tempImgUri !== null ? state.tempImgUri : (item ? item.imageUri : null);

            container.innerHTML = `
                ${renderImageEditorHTML()}
                <label>📦 Stock List Number / Equipment Code:</label>
                <input type="text" id="f-stock" placeholder="e.g. ST/P103/2015/E001" value="${item ? (item.stockCode || '') : ''}">

                <label>⚙ Equipment Name:</label>
                <input type="text" id="f-name" placeholder="e.g. Lathe Machine" value="${item ? item.name : ''}">

                <label>🔧 Problem Description:</label>
                <input type="text" id="f-problem" placeholder="e.g. Abnormal motor noise" value="${item ? item.problem : ''}">

                <label>📅 Reported Date:</label>
                <input type="date" id="f-date" value="${item ? item.date : new Date().toISOString().substring(0,10)}">

                <label>📌 Repair Status:</label>
                <select id="f-status">
                    <option value="Pending Repair" ${item && item.status === 'Pending Repair' ? 'selected' : ''}>Pending Repair</option>
                    <option value="Repaired" ${item && item.status === 'Repaired' ? 'selected' : ''}>Repaired</option>
                    <option value="Returned" ${item && item.status === 'Returned' ? 'selected' : ''}>Returned</option>
                </select>

                <label>📝 Additional Remarks:</label>
                <textarea id="f-remarks" placeholder="Enter repair action details">${item ? (item.remarks || '') : ''}</textarea>

                <button class="btn btn-green" onclick="saveFaulty()">💾 Save Faulty Report</button>
                ${item ? `<button class="btn btn-red" onclick="deleteSingleItem('faultyList', '${item.id}')">❌ Delete Report</button>` : ''}
            `;
            updateImagePreview();
        }

        function saveFaulty() {
            let name = document.getElementById('f-name').value.trim();
            let stockCode = document.getElementById('f-stock').value.trim();
            let problem = document.getElementById('f-problem').value.trim();
            let date = document.getElementById('f-date').value;
            let status = document.getElementById('f-status').value;
            let remarks = document.getElementById('f-remarks').value.trim();
            if (!name) { alert("Enter Equipment Name!"); return; }

            let activeLab = labProfiles[state.currentLab];
            if (state.editingId) {
                let item = activeLab.faultyList.find(i => i.id === state.editingId);
                if (item) { Object.assign(item, { stockCode, name, problem, date, status, remarks, imageUri: state.tempImgUri }); }
                addLog(`Updated Faulty Report for: ${name} in ${state.currentLab}`);
            } else {
                let id = 'F-' + (activeLab.faultyList.length + 1);
                activeLab.faultyList.push({ id, stockCode, name, problem, date, status, remarks, imageUri: state.tempImgUri });
                addLog(`Created Faulty Report: ${name} in ${state.currentLab}`);
            }
            saveData();
            goBack();
        }

        // 5. WRITE OFF LIST & EDIT
        function renderWriteOffList(container) {
            renderSearchBar(container, "Search Write Off Asset Name...", val => {});
            let items = getFilteredCurrentItems();
            renderSelectionBar(container, items.length);

            let listDiv = document.createElement('div');
            items.forEach(item => {
                let card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <input type="checkbox" ${state.selectedIds.has(item.code) ? 'checked' : ''} onclick="event.stopPropagation(); toggleItemSelection('${item.code}')">
                    <div class="item-info">
                        <h2>${item.code} · ${item.name}</h2>
                        <p>Reason: ${item.reason} • <b>${item.status}</b></p>
                    </div>
                `;
                card.onclick = () => switchScreen('WRITEOFF_EDIT', item.code);
                listDiv.appendChild(card);
            });
            container.appendChild(listDiv);

            let addBtn = document.createElement('button');
            addBtn.className = 'btn btn-red';
            addBtn.innerText = '＋ Add Write Off Proposal';
            addBtn.onclick = () => { state.tempImgUri = null; switchScreen('WRITEOFF_EDIT', null); };
            container.appendChild(addBtn);
        }

        function renderWriteOffEdit(container) {
            let activeLab = labProfiles[state.currentLab];
            let item = activeLab ? activeLab.writeOffList.find(i => i.code === state.editingId) : null;
            state.tempImgUri = state.tempImgUri !== null ? state.tempImgUri : (item ? item.imageUri : null);

            container.innerHTML = `
                ${renderImageEditorHTML()}
                <label>📦 Stock List Number / Asset Code:</label>
                <input type="text" id="w-code" placeholder="e.g. AST-001" value="${item ? item.code : ''}">

                <label>⚙ Equipment / Asset Name:</label>
                <input type="text" id="w-name" placeholder="e.g. Hydraulic Pump" value="${item ? item.name : ''}">

                <label>🗑 Reason for Write Off:</label>
                <input type="text" id="w-reason" placeholder="e.g. Beyond economic repair" value="${item ? item.reason : ''}">

                <label>📌 Write Off Status:</label>
                <select id="w-status">
                    <option value="Pending" ${item && item.status === 'Pending' ? 'selected' : ''}>Pending</option>
                    <option value="Approved" ${item && item.status === 'Approved' ? 'selected' : ''}>Approved</option>
                    <option value="Not Approved" ${item && item.status === 'Not Approved' ? 'selected' : ''}>Not Approved</option>
                </select>

                <label>📝 Additional Remarks:</label>
                <textarea id="w-remarks" placeholder="Enter disposal approval notes">${item ? (item.remarks || '') : ''}</textarea>

                <button class="btn btn-green" onclick="saveWriteOff()">💾 Save Write Off Proposal</button>
                ${item ? `<button class="btn btn-red" onclick="deleteSingleItem('writeOffList', '${item.code}')">❌ Delete Proposal</button>` : ''}
            `;
            updateImagePreview();
        }

        function saveWriteOff() {
            let code = document.getElementById('w-code').value.trim();
            let name = document.getElementById('w-name').value.trim();
            let reason = document.getElementById('w-reason').value.trim();
            let status = document.getElementById('w-status').value;
            let remarks = document.getElementById('w-remarks').value.trim();
            if (!code || !name) { alert("Enter Asset Code & Name!"); return; }

            let activeLab = labProfiles[state.currentLab];
            if (state.editingId) {
                let item = activeLab.writeOffList.find(i => i.code === state.editingId);
                if (item) { Object.assign(item, { code, name, reason, status, remarks, imageUri: state.tempImgUri }); }
                addLog(`Updated Write Off Proposal: ${code} in ${state.currentLab}`);
            } else {
                activeLab.writeOffList.push({ code, name, reason, status, remarks, imageUri: state.tempImgUri });
                addLog(`Created Write Off Proposal: ${code} (${name}) in ${state.currentLab}`);
            }
            saveData();
            goBack();
        }

        // IMAGE HANDLING HELPERS
        function renderImageEditorHTML() {
            return `
                <div class="card text-center">
                    <img id="img-preview" class="img-preview">
                    <div class="row" style="margin-top:8px;">
                        <button class="btn btn-blue btn-inline col" onclick="triggerCamera()">📸 Camera</button>
                        <button class="btn btn-purple btn-inline col" onclick="triggerImageFile()">📁 Gallery</button>
                        <button class="btn btn-red btn-inline col" onclick="removeImage()">🗑 Remove</button>
                    </div>
                </div>
            `;
        }

        function updateImagePreview() {
            let img = document.getElementById('img-preview');
            if (img) {
                if (state.tempImgUri && state.tempImgUri !== 'REMOVED') {
                    img.src = state.tempImgUri;
                    img.style.display = 'block';
                } else {
                    img.style.display = 'none';
                }
            }
        }

        function triggerCamera() { document.getElementById('camera-input-img').click(); }
        function triggerImageFile() { document.getElementById('file-input-img').click(); }

        function handleImageFileSelected(e) {
            let file = e.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = (event) => {
                    state.tempImgUri = event.target.result;
                    updateImagePreview();
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            state.tempImgUri = 'REMOVED';
            updateImagePreview();
        }

        function toggleItemSelection(id) {
            if (state.selectedIds.has(id)) state.selectedIds.delete(id);
            else state.selectedIds.add(id);
            render();
        }

        function deleteSingleItem(listKey, id) {
            if (confirm("Are you sure you want to delete this item?")) {
                let activeLab = labProfiles[state.currentLab];
                activeLab[listKey] = activeLab[listKey].filter(i => (i.id || i.code) !== id);
                saveData();
                goBack();
            }
        }

        // 6. MORE & LOGS SCREEN
        function renderMore(container) {
            container.innerHTML = `
                <div class="card">
                    <h2>App Information</h2>
                    <p>Version: v1.2.0 (PWA Web Edition)</p>
                    <button class="btn btn-purple" onclick="switchScreen('LOGS')">📜 View Activity Logs</button>
                </div>

                <div class="card">
                    <h2>Data Import & Export</h2>
                    <button class="btn btn-blue" onclick="triggerCSVImport(false)">📂 Import CSV File (Append Data)</button>
                    <button class="btn btn-green" onclick="exportCSV()">📊 Export Data to CSV File</button>
                    <button class="btn btn-red" onclick="triggerCSVImport(true)">⚠️ Overwrite & Replace Data from CSV</button>
                </div>
            `;
        }

        function renderLogs(container) {
            let html = `<h2>📋 Historical Change History</h2>`;
            if (activityLogs.length === 0) {
                html += `<p>No activity logs recorded yet.</p>`;
            } else {
                activityLogs.forEach(log => {
                    html += `<div class="card" style="padding:8px;"><p style="font-size:11px;">${log}</p></div>`;
                });
            }
            container.innerHTML = html;
        }

        // --- CSV IMPORT & EXPORT LOGIC ---
        function triggerCSVImport(isOverwrite) {
            state.isOverwriteMode = isOverwrite;
            if (isOverwrite) {
                if (!confirm(`⚠️ Warning: Are you sure you want to OVERWRITE all data for '${state.currentLab}'? This cannot be undone!`)) return;
            }
            document.getElementById('file-input-csv').click();
        }

        function handleCSVFileSelected(e) {
            let file = e.target.files[0];
            if (!file) return;

            let reader = new FileReader();
            reader.onload = (event) => {
                parseAndImportCSV(event.target.result);
            };
            reader.readAsText(file);
        }

        function parseAndImportCSV(text) {
            let lines = text.split('\n');
            let fileLab = '';
            let currentSection = '';
            let count = 0;

            lines.forEach(line => {
                let l = line.trim();
                if (l.startsWith('Lab Location,')) {
                    let parts = l.split(',');
                    if (parts.length > 1) fileLab = parts[1].replace(/"/g, '').trim();
                }
            });

            if (fileLab) state.currentLab = fileLab;
            if (!labProfiles[state.currentLab]) labProfiles[state.currentLab] = { equipmentList: [], teachingList: [], faultyList: [], writeOffList: [] };

            let activeLab = labProfiles[state.currentLab];

            if (state.isOverwriteMode) {
                activeLab.equipmentList = [];
                activeLab.teachingList = [];
                activeLab.faultyList = [];
                activeLab.writeOffList = [];
            }

            lines.forEach(line => {
                let l = line.trim();
                if (!l) return;

                if (l.includes('SECTION 1: EQUIPMENT LIST')) { currentSection = 'EQUIPMENT'; return; }
                if (l.includes('SECTION 2: TEACHING MATERIALS ORDER')) { currentSection = 'TEACHING'; return; }
                if (l.includes('SECTION 3: FAULTY / REPAIR REPORTS')) { currentSection = 'FAULTY'; return; }
                if (l.includes('SECTION 4: ASSET WRITE OFF PROPOSALS')) { currentSection = 'WRITEOFF'; return; }

                if (l.startsWith('No.,') || l.startsWith('Equipment Code,') || l.startsWith('Report ID,') || l.startsWith('Asset Code,')) return;

                let tokens = parseCSVLine(l);
                if (tokens.length < 2) return;

                if (currentSection === 'EQUIPMENT') {
                    let code = tokens[1] || tokens[0];
                    let name = tokens[2] || tokens[1];
                    if (code && name && !code.includes('No Equipment')) {
                        if (!activeLab.equipmentList.some(i => i.code === code)) {
                            activeLab.equipmentList.push({ code, name, imageUri: null });
                            count++;
                        }
                    }
                } else if (currentSection === 'TEACHING') {
                    let name = tokens[1] || tokens[0];
                    let qty = tokens[2] || tokens[1];
                    let remarks = tokens[3] || '';
                    if (name && !name.includes('No Teaching')) {
                        activeLab.teachingList.push({ id: 'TM-' + Date.now() + '-' + count, name, qtyUnit: qty, remarks, imageUri: null });
                        count++;
                    }
                } else if (currentSection === 'FAULTY') {
                    if (tokens.length >= 4 && !tokens[0].includes('No Faulty')) {
                        activeLab.faultyList.push({
                            id: tokens[0], stockCode: tokens[1] || '', name: tokens[2] || tokens[1],
                            problem: tokens[3] || tokens[2], date: tokens[4] || tokens[3],
                            status: tokens[5] || 'Pending Repair', remarks: tokens[6] || '', imageUri: null
                        });
                        count++;
                    }
                } else if (currentSection === 'WRITEOFF') {
                    if (tokens.length >= 3 && !tokens[0].includes('No Asset Write')) {
                        activeLab.writeOffList.push({
                            code: tokens[0], name: tokens[1], reason: tokens[2],
                            status: tokens[3] || 'Pending', remarks: tokens[4] || '', imageUri: null
                        });
                        count++;
                    }
                }
            });

            saveData();
            addLog(`${state.isOverwriteMode ? 'Overwritten' : 'Imported'} ${count} record(s) into ${state.currentLab}`);
            alert(`Successfully imported ${count} record(s) into ${state.currentLab}!`);
            switchScreen('HOME');
        }

        function parseCSVLine(line) {
            let result = [], inQuotes = false, sb = '';
            for (let i = 0; i < line.length; i++) {
                let c = line.charAt(i);
                if (c === '"') inQuotes = !inQuotes;
                else if (c === ',' && !inQuotes) { result.push(sb.trim()); sb = ''; }
                else sb += c;
            }
            result.push(sb.trim());
            return result.map(s => s.replace(/^"|"$/g, '').replace(/""/g, '"'));
        }

        function exportCSV() {
            let activeLab = labProfiles[state.currentLab];
            if (!activeLab) return;

            let csv = `Lab Location,"${state.currentLab}"\nGenerated Date,"${new Date().toISOString()}"\n\n`;

            csv += `---------------------------------------------------------------------------------\nSECTION 1: EQUIPMENT LIST\n---------------------------------------------------------------------------------\nNo.,Equipment Code,Equipment Name\n`;
            activeLab.equipmentList.forEach((e, idx) => { csv += `${idx+1},"${e.code}","${e.name}"\n`; });

            csv += `\n---------------------------------------------------------------------------------\nSECTION 2: TEACHING MATERIALS ORDER\n---------------------------------------------------------------------------------\nNo.,Item Name,Quantity Unit,Remarks\n`;
            activeLab.teachingList.forEach((t, idx) => { csv += `${idx+1},"${t.name}","${t.qtyUnit}","${t.remarks||''}"\n`; });

            csv += `\n---------------------------------------------------------------------------------\nSECTION 3: FAULTY / REPAIR REPORTS\n---------------------------------------------------------------------------------\nReport ID,Stock Code,Asset Name,Problem Description,Reported Date,Status,Remarks\n`;
            activeLab.faultyList.forEach(f => { csv += `"${f.id}","${f.stockCode||''}","${f.name}","${f.problem}","${f.date}","${f.status}","${f.remarks||''}"\n`; });

            csv += `\n---------------------------------------------------------------------------------\nSECTION 4: ASSET WRITE OFF PROPOSALS\n---------------------------------------------------------------------------------\nAsset Code,Asset Name,Disposal Reason,Status,Remarks\n`;
            activeLab.writeOffList.forEach(w => { csv += `"${w.code}","${w.name}","${w.reason}","${w.status}","${w.remarks||''}"\n`; });

            let blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            let link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `LabReport_${state.currentLab.replace(/\s+/g, '_')}.csv`;
            link.click();
        }

        // INITIAL STARTUP
        render();

        // Register Service Worker for Offline PWA Support
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
        }
    </script>
</body>
</html>
